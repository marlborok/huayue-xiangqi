<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紙偶繪本示範</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #F8EFE2; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #3B2A2F; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  /* watercolor paper: fractal noise multiplied over the whole frame */
  .paper { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .55;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .paper[hidden] { display: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(150, 110, 80, .22) 100%); }
  .info { position: absolute; left: 16px; top: 12px; right: 16px; font-size: 15px; line-height: 1.6; text-shadow: 0 0 6px #fff; }
  .info b { font-family: "LXGW WenKai TC", serif; font-size: 22px; color: #D9445C; }
  .tools { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font-family: inherit; font-size: 15px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid #3B2A2F; background: #fff; color: #3B2A2F; cursor: pointer; }
  button[aria-pressed="true"] { background: #3B2A2F; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="paper" id="paper"></div>
<div class="vignette"></div>
<div class="info"><b>紙偶繪本示範</b><br>插畫角色立在 3D 棋盤上，會轉向鏡頭。花之國是正式插畫，月之國暫時用花之國的圖換色代替。拖曳可旋轉、縮放。</div>
<div class="tools">
  <button id="paperBtn" aria-pressed="true">紙紋</button>
  <button id="badgeBtn" aria-pressed="true">徽章</button>
  <button id="bounce" aria-pressed="true">跳動</button>
  <button id="side">從對面看</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/figures.js"></script>
<script src="js/terrain.js"></script>
<script>
(async function () {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.maxPolarAngle = 1.35; controls.minDistance = 4; controls.maxDistance = 30;

  /* soft, warm, low-contrast light: a picture-book look rather than a lit stage */
  scene.add(new THREE.HemisphereLight('#FFF6EC', '#E8D2C6', 0.95));
  const sun = new THREE.DirectionalLight('#FFF1E0', 0.55); sun.position.set(6, 12, 8); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);

  const terrain = XQTerrain.build(scene, aniso); scene.fog = terrain.fog;

  try { await Promise.race([document.fonts.load('700 150px "LXGW WenKai TC"', '帥將仕士相象俥車傌馬炮包兵卒'), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}

  const TYPES = ['K', 'A', 'B', 'R', 'N', 'C', 'P'];
  const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  const imgs = {}; await Promise.all(TYPES.map(async t => { imgs[t] = await load(`assets/paper/flower-${t}.png`); }));
  /* moon kingdom stand-in until its pictures exist: the flower picture, mirrored and shifted to lavender/blue */
  function variant(img, flip, filter) {
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const g = cv.getContext('2d');
    if (flip) { g.translate(cv.width, 0); g.scale(-1, 1); }
    g.filter = filter || 'none'; g.drawImage(img, 0, 0);
    const t = new THREE.CanvasTexture(cv); t.anisotropy = aniso; return t;
  }
  const tex = { r: {}, b: {} };
  TYPES.forEach(t => { tex.r[t] = variant(imgs[t], false); tex.b[t] = variant(imgs[t], true, 'hue-rotate(215deg) saturate(0.85) brightness(0.95)'); });
  /* card height per role: the queen a little taller, the little soldier shorter, the rider wider */
  const HEIGHT = { K: 1.2, A: 1.1, B: 1.1, R: 1.1, N: 1.15, C: 1.1, P: 0.9 };

  const LAYOUT = [['R', 0], ['N', 1], ['B', 2], ['A', 3], ['K', 4], ['A', 5], ['B', 6], ['N', 7], ['R', 8]];
  const CH = { r: { K: '帥', A: '仕', B: '相', R: '俥', N: '傌', C: '炮', P: '兵' }, b: { K: '將', A: '士', B: '象', R: '車', N: '馬', C: '包', P: '卒' } };
  const pieces = [];
  function place(side, t, file, rank) {
    const root = new THREE.Group(); root.position.set(file - 4, 0, 4.5 - rank); scene.add(root);
    const doll = new THREE.Group(); root.add(doll);
    /* unlit: the illustration already carries its own shading, scene lights would only muddy it */
    const map = tex[side][t], H = HEIGHT[t], W = H * imgs[t].width / imgs[t].height;
    const mat = new THREE.MeshBasicMaterial({ map, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide });
    const card = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat); card.position.y = H / 2; card.castShadow = true;
    card.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map, alphaTest: 0.35 });
    doll.add(card);
    /* paper base: a soft watercolor puddle so the card reads as standing on the land */
    const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.42, 32), new THREE.MeshBasicMaterial({ color: side === 'r' ? '#E8A9B6' : '#9C9AD0', transparent: true, opacity: 0.45, depthWrite: false }));
    puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.012; root.add(puddle);
    const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: XQFigures.badgeTexture(side, CH[side][t], aniso), depthTest: false }));
    badge.scale.setScalar(0.5); badge.position.y = H + 0.3; badge.renderOrder = 10; root.add(badge);
    pieces.push({ root, doll, badge, phase: Math.random() * 6.28 });
  }
  LAYOUT.forEach(([t, f]) => { place('r', t, f, 0); place('b', t, f, 9); });
  [1, 7].forEach(f => { place('r', 'C', f, 2); place('b', 'C', f, 7); });
  [0, 2, 4, 6, 8].forEach(f => { place('r', 'P', f, 3); place('b', 'P', f, 6); });

  let from = 1;
  function home() {
    const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(5.6 / half, 5.6 / (half * camera.aspect)) * 0.95;
    const phi = 0.75;
    camera.position.set(0, dist * Math.cos(phi), dist * Math.sin(phi) * from); controls.target.set(0, 0, 0.4 * from); controls.update();
  }
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', () => { resize(); }); resize(); home();

  const st = { bounce: true };
  const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); fn(v); }; };
  tog('paperBtn', v => document.getElementById('paper').hidden = !v);
  tog('badgeBtn', v => pieces.forEach(p => p.badge.visible = v));
  tog('bounce', v => st.bounce = v);
  document.getElementById('side').onclick = () => { from = -from; home(); };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const tmp = new THREE.Vector3();
  function loop(now) {
    const t = now / 1000;
    pieces.forEach(p => {
      /* cylindrical billboard: turn around y only, so the card stays upright while facing the camera */
      p.root.getWorldPosition(tmp);
      p.doll.rotation.y = Math.atan2(camera.position.x - tmp.x, camera.position.z - tmp.z);
      const b = st.bounce && !reduce ? Math.abs(Math.sin(t * 2.2 + p.phase)) : 0;
      p.doll.position.y = b * 0.06; p.doll.rotation.z = st.bounce && !reduce ? Math.sin(t * 2.2 + p.phase) * 0.03 : 0;
    });
    terrain.update(t, camera, controls.target);
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
