<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色樣品：花之國・帥</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBEFEA; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #3B2A2F; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  .info { position: absolute; left: 16px; top: 12px; font-size: 15px; line-height: 1.6; }
  .info b { font-size: 20px; color: #D9445C; }
  .tools { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 700 15px inherit; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid #3B2A2F; background: #fff; color: #3B2A2F; cursor: pointer; }
  button[aria-pressed="true"] { background: #3B2A2F; color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="info"><b>花之國・帥　櫻花女王</b><br>程式生成的 Q 版角色樣品（卡通著色＋描邊），拖曳可旋轉</div>
<div class="tools">
  <button id="spin" aria-pressed="true">自動旋轉</button>
  <button id="line" aria-pressed="true">描邊</button>
  <button id="old" aria-pressed="false">對照：目前的暫代版</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/figures.js"></script>
<script>
(function () {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#FBEFEA');
  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
  camera.position.set(0, 1.0, 3.0);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0.55, 0); controls.enableDamping = true; controls.minDistance = 1.2; controls.maxDistance = 6;

  scene.add(new THREE.HemisphereLight('#FFF4F0', '#E7C9D2', 0.75));
  const sun = new THREE.DirectionalLight('#FFFFFF', 0.85); sun.position.set(2, 4, 3); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5 }); scene.add(sun);

  const ground = new THREE.Mesh(new THREE.CircleGeometry(1.1, 48), new THREE.MeshStandardMaterial({ color: '#F6D9DF', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  /* ---- toon toolkit ---- */
  const ramp = (() => { const d = new Uint8Array([90, 90, 90, 255, 185, 185, 185, 255, 255, 255, 255, 255]);
    const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
  const T = (c, o) => new THREE.MeshToonMaterial(Object.assign({ color: new THREE.Color(c).convertSRGBToLinear(), gradientMap: ramp }, o || {}));
  const outlineMat = new THREE.MeshBasicMaterial({ color: '#5A3540', side: THREE.BackSide });
  const outlines = [];
  function add(parent, geo, mat, x, y, z, line) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; parent.add(m);
    if (line !== false) { const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(line || 1.06); m.add(o); outlines.push(o); }
    return m;
  }
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 32, h || 20);

  /* palette: 花之國 */
  const C = { skin: T('#FCE3D4'), blush: T('#FF9DB0'), hair: T('#8A4A3C'), hairHi: T('#A9604E'),
    dress: T('#F27D93'), dressLight: T('#FFC2CF'), white: T('#FFF8F4'), gold: T('#F2BE4A'),
    petal: T('#FFB7C8'), petalDeep: T('#FF8FA8'), eye: T('#4A2630'), leaf: T('#8CCB7E') };

  function sakuraQueen() {
    const g = new THREE.Group();

    /* skirt: lathe profile, flared with a scalloped hem layer */
    const prof = [[0.0, 0.02], [0.30, 0.03], [0.32, 0.08], [0.27, 0.20], [0.19, 0.34], [0.12, 0.42], [0.0, 0.43]].map(p => new THREE.Vector2(p[0], p[1]));
    add(g, new THREE.LatheGeometry(prof, 40), C.dress, 0, 0, 0, 1.04);
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const s = add(g, S(0.06, 12, 8), C.dressLight, Math.cos(a) * 0.3, 0.05, Math.sin(a) * 0.3, false); s.scale.set(1, 0.6, 1); }
    /* apron petal front */
    const apron = add(g, S(0.13, 20, 14), C.white, 0, 0.2, 0.17, 1.05); apron.scale.set(0.9, 1.3, 0.35);

    /* torso + sash */
    const torso = add(g, S(0.14), C.dress, 0, 0.5, 0); torso.scale.set(1, 1.05, 0.85);
    const sash = add(g, new THREE.TorusGeometry(0.13, 0.03, 10, 32), C.gold, 0, 0.42, 0, false); sash.rotation.x = Math.PI / 2;
    const bow = add(g, S(0.06, 16, 10), C.petalDeep, 0, 0.42, -0.14); bow.scale.set(1.6, 0.9, 0.6);

    /* arms: shoulder puffs + sleeves + hands */
    [1, -1].forEach(s => {
      add(g, S(0.075), C.dressLight, s * 0.15, 0.56, 0);
      const arm = add(g, new THREE.CylinderGeometry(0.04, 0.045, 0.2, 12), C.white, s * 0.2, 0.46, 0.04);
      arm.rotation.z = s * 0.35; arm.rotation.x = -0.3;
      add(g, S(0.045), C.skin, s * 0.235, 0.36, 0.1);
    });

    /* cape: open half-lathe at the back */
    const capeProf = [[0.15, 0.58], [0.22, 0.4], [0.3, 0.12], [0.34, 0.04]].map(p => new THREE.Vector2(p[0], p[1]));
    const cape = new THREE.Mesh(new THREE.LatheGeometry(capeProf, 24, Math.PI * 0.55, Math.PI * 0.9), T('#D9445C', { side: THREE.DoubleSide }));
    cape.castShadow = true; g.add(cape);

    /* head */
    const head = new THREE.Group(); head.position.set(0, 0.86, 0); g.add(head);
    const face = add(head, S(0.25), C.skin); face.scale.set(1, 0.95, 0.95);
    /* eyes: dark oval + two highlights */
    [1, -1].forEach(s => {
      const e = add(head, S(0.045, 20, 14), C.eye, s * 0.085, -0.02, 0.215, false); e.scale.set(0.8, 1.15, 0.5);
      add(head, S(0.016, 10, 8), C.white, s * 0.085 + 0.012, 0.005, 0.235, false);
      add(head, S(0.008, 8, 6), C.white, s * 0.085 - 0.01, -0.04, 0.236, false);
      const b = add(head, S(0.035, 14, 10), C.blush, s * 0.15, -0.085, 0.185, false); b.scale.set(1.3, 0.7, 0.4);
    });
    const mouth = add(head, new THREE.TorusGeometry(0.02, 0.006, 6, 16, Math.PI), C.eye, 0, -0.1, 0.225, false); mouth.rotation.z = Math.PI;

    /* hair: cap + bangs + side locks + two long twin tails with petal ties */
    const cap = add(head, new THREE.SphereGeometry(0.27, 32, 20, 0, Math.PI * 2, 0, Math.PI * 0.62), C.hair, 0, 0.02, -0.02); cap.rotation.x = -0.45;
    [-2, -1, 0, 1, 2].forEach(i => { const b = add(head, S(0.075, 16, 12), C.hair, i * 0.075, 0.13 - Math.abs(i) * 0.02, 0.17, 1.05); b.scale.set(0.9, 1.1, 0.55); });
    [1, -1].forEach(s => {
      const lock = add(head, S(0.06, 14, 10), C.hair, s * 0.22, -0.1, 0.08); lock.scale.set(0.6, 1.6, 0.7);
      /* twin tails */
      const tie = add(head, S(0.045), C.petalDeep, s * 0.25, 0.08, -0.08);
      for (let k = 0; k < 4; k++) { const t = add(head, S(0.085 - k * 0.012, 16, 12), C.hair, s * (0.33 + k * 0.03), -0.02 - k * 0.12, -0.12 - k * 0.02); t.scale.set(0.8, 1.2, 0.8); }
    });

    /* crown: gold band + five sakura petals + jewel */
    const crown = new THREE.Group(); crown.position.set(0, 0.24, -0.01); crown.rotation.x = -0.25; head.add(crown);
    add(crown, new THREE.CylinderGeometry(0.13, 0.14, 0.05, 32, 1, true), T('#F2BE4A', { side: THREE.DoubleSide }), 0, 0, 0, 1.04);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + Math.PI / 2;
      const p = add(crown, S(0.05, 14, 10), C.petal, Math.cos(a) * 0.12, 0.06, Math.sin(a) * 0.12, 1.08); p.scale.set(0.7, 1.2, 0.35); p.lookAt(0, 0.06, 0); p.rotateY(Math.PI);
    }
    add(crown, new THREE.OctahedronGeometry(0.035), T('#FF5C7F', { emissive: '#FF5C7F', emissiveIntensity: 0.35 }), 0, 0.05, 0.135, 1.1);

    /* scepter: gold rod topped with a sakura blossom */
    const sc = new THREE.Group(); sc.position.set(0.25, 0.36, 0.1); sc.rotation.z = -0.12; g.add(sc);
    add(sc, new THREE.CylinderGeometry(0.014, 0.014, 0.62, 10), C.gold, 0, 0.12, 0, 1.25);
    const bloom = new THREE.Group(); bloom.position.y = 0.46; sc.add(bloom);
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; const p = add(bloom, S(0.045, 14, 10), C.petal, Math.cos(a) * 0.05, Math.sin(a) * 0.05, 0, 1.08); p.scale.set(0.8, 0.8, 0.3); }
    add(bloom, S(0.025), C.gold, 0, 0, 0.01, false);
    add(sc, S(0.03), C.leaf, 0.03, 0.4, 0, false).scale.set(1.4, 0.6, 0.4);

    /* shoes */
    [1, -1].forEach(s => { const sh = add(g, S(0.055), C.petalDeep, s * 0.08, 0.03, 0.06); sh.scale.set(0.9, 0.55, 1.3); });

    g.userData = { head, bloom };
    return g;
  }

  const queen = sakuraQueen(); queen.scale.setScalar(1.0); scene.add(queen);
  const placeholder = XQFigures.figure('r', 'K'); placeholder.scale.setScalar(1.05); placeholder.visible = false; scene.add(placeholder);

  /* floating petals around her */
  const petals = [];
  for (let i = 0; i < 14; i++) { const p = new THREE.Mesh(S(0.025, 8, 6), C.petal); p.scale.set(1, 0.4, 0.7); p.userData = { a: Math.random() * 6.28, r: 0.5 + Math.random() * 0.5, h: Math.random() * 1.2, s: 0.3 + Math.random() * 0.4 }; scene.add(p); petals.push(p); }

  const state = { spin: true };
  const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); fn(v); }; };
  tog('spin', v => state.spin = v);
  tog('line', v => outlines.forEach(o => o.visible = v));
  tog('old', v => { placeholder.visible = v; queen.visible = !v; });

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function loop(now) {
    const t = now / 1000;
    if (state.spin && !reduce) { queen.rotation.y += 0.006; placeholder.rotation.y = queen.rotation.y; }
    if (!reduce) {
      queen.position.y = Math.sin(t * 2) * 0.01;                 /* breathing bob */
      queen.userData.head.rotation.z = Math.sin(t * 1.3) * 0.05;  /* gentle head tilt */
      queen.userData.bloom.rotation.z = t * 0.6;
      petals.forEach(p => { const d = p.userData; d.a += 0.004 * d.s; d.h -= 0.002 * d.s; if (d.h < 0) d.h = 1.3;
        p.position.set(Math.cos(d.a) * d.r, d.h, Math.sin(d.a) * d.r); p.rotation.set(t * d.s, t, 0); });
    }
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
